[package]
name = "num-rational-parse"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "A flexible string parsing extension for num_rational::Ratio, supporting fractions, decimals, and scientific notation (inspired by Python's fractions module)."
license = "MIT OR Apache-2.0"
keywords = ["rational", "math", "parsing", "fraction"]
categories = ["mathematics", "parsing"]
repository = "https://github.com/Boslx/num-rational-parse"
readme = "README.md"
exclude = ["/.github"]

[dependencies]
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "^2.0.21"
winnow = { version = "^1.0.5", default-features = false, features = ["std", "ascii"] }

[dev-dependencies]
criterion = "0.5.1"
pyo3 = { version = "0.30", features = ["auto-initialize"] }

[lints.clippy]
pedantic = "warn"

[[bench]]
name = "parse"
path = "benches/parsing.rs"
harness = false
